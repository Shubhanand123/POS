<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3355ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Galla">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Galla POS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: app shell — labelled sidebar (icon rail on tablets, bottom tab bar on phones), centre workspace, right-hand order panel on Billing that becomes a slide-up sheet on phones. */
:root{
  /* palette: set by the colour picker (Royal blue by default) */
  --pb:#3355ff; --pd:#141b4d; --pm:#2a44d6; --a1:#ff9f43; --a2:#ff6b3d; --on-a:#ffffff;
  --bg:#f3f4f8; --surface:#ffffff; --surface-2:#f6f7fb; --surface-3:#eceef5; --line:#e6e8f0; --line-2:#d3d7e3;
  --fg:#11131c; --muted:#646a7d; --faint:#9a9fb0;
  --brand:var(--pb); --brand-2:var(--pd); --brand-soft:color-mix(in srgb,var(--pb) 11%,var(--surface)); --on-brand:#ffffff;
  --gold:var(--a1); --gold-2:var(--a2); --gold-soft:color-mix(in srgb,var(--a1) 15%,var(--surface)); --on-gold:var(--on-a);
  --good:#16a34a; --good-soft:#e3f6ea; --warn:#c27400; --warn-soft:#fff1d9; --bad:#dc3d2e; --bad-soft:#fde6e3; --info:#2f6fde; --info-soft:#e4edfd;
  --t1:#e4f5ea; --t2:#fff1db; --t3:#e7edff; --t4:#ffe8ee; --t5:#f0eaff; --t6:#def4f7; --t7:#f1f2f6;
  --shadow-sm:0 1px 2px rgba(17,19,40,.06);
  --shadow:0 1px 2px rgba(17,19,40,.05),0 10px 30px -12px rgba(17,19,40,.18);
  --shadow-lg:0 30px 80px -20px rgba(10,12,30,.4);
  --display:"Sora",ui-sans-serif,system-ui,sans-serif;
  --body:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:18px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b0c12; --surface:#14161f; --surface-2:#1a1d28; --surface-3:#222633; --line:#232736; --line-2:#323748;
  --fg:#eceef6; --muted:#9a9fb3; --faint:#6b7085;
  --brand:color-mix(in srgb,var(--pb) 62%,#ffffff); --brand-soft:color-mix(in srgb,var(--pb) 22%,var(--surface)); --on-brand:#0b0c12;
  --gold-soft:color-mix(in srgb,var(--a1) 20%,var(--surface));
  --good:#3fcf7a; --good-soft:#12301f; --warn:#f3aa3c; --warn-soft:#3a2810; --bad:#f26b5d; --bad-soft:#3b1814; --info:#6d9cf5; --info-soft:#17233d;
  --t1:#172b22; --t2:#30260f; --t3:#1b2242; --t4:#36192a; --t5:#271f42; --t6:#132d34; --t7:#20232e;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow:0 1px 2px rgba(0,0,0,.35),0 12px 30px -12px rgba(0,0,0,.6);
  --shadow-lg:0 30px 80px -20px rgba(0,0,0,.8);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b0c12; --surface:#14161f; --surface-2:#1a1d28; --surface-3:#222633; --line:#232736; --line-2:#323748;
  --fg:#eceef6; --muted:#9a9fb3; --faint:#6b7085;
  --brand:color-mix(in srgb,var(--pb) 62%,#ffffff); --brand-soft:color-mix(in srgb,var(--pb) 22%,var(--surface)); --on-brand:#0b0c12;
  --gold-soft:color-mix(in srgb,var(--a1) 20%,var(--surface));
  --good:#3fcf7a; --good-soft:#12301f; --warn:#f3aa3c; --warn-soft:#3a2810; --bad:#f26b5d; --bad-soft:#3b1814; --info:#6d9cf5; --info-soft:#17233d;
  --t1:#172b22; --t2:#30260f; --t3:#1b2242; --t4:#36192a; --t5:#271f42; --t6:#132d34; --t7:#20232e;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow:0 1px 2px rgba(0,0,0,.35),0 12px 30px -12px rgba(0,0,0,.6);
  --shadow-lg:0 30px 80px -20px rgba(0,0,0,.8);
  color-scheme:dark}

html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14.5px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden}
*{box-sizing:border-box}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2.5px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
svg{flex:none}

.shell{display:grid;grid-template-columns:252px minmax(0,1fr) 404px;height:100%;padding:12px;gap:12px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.shell.wide{grid-template-columns:252px minmax(0,1fr)}

/* ---------- sidebar ---------- */
.side{background:var(--surface);color:var(--fg);box-shadow:var(--shadow-sm);border-radius:24px;display:flex;flex-direction:column;padding:20px 14px;gap:6px;min-height:0;position:relative;overflow:hidden}
.side::before{content:"";position:absolute;inset:auto -60px -80px auto;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--pb) 14%,transparent),transparent 65%);pointer-events:none}
.brand{display:flex;align-items:center;gap:11px;padding:2px 8px 18px}
.mark{width:40px;height:40px;border-radius:13px;background:linear-gradient(145deg,var(--pm),var(--pd));display:grid;place-items:center;box-shadow:0 8px 18px -6px color-mix(in srgb,var(--pb) 70%,transparent);flex:none}
.mark svg{width:22px;height:22px;color:#fff}
.wordmark{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.02em;color:var(--fg)}
.wordmark small{display:block;font-family:var(--body);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-top:-2px}
.navlabel{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);padding:10px 12px 4px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;border:0;background:transparent;color:var(--muted);padding:11px 12px;border-radius:13px;font-weight:600;font-size:14.5px;text-align:left;position:relative;transition:background .15s,color .15s}
.nav button svg{width:20px;height:20px}
.nav button:hover{background:var(--surface-2);color:var(--fg)}
.nav button[aria-current="page"]{background:var(--brand-soft);color:var(--brand)}
.nav button[aria-current="page"]::before{content:"";position:absolute;left:-14px;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;background:var(--brand)}
.nav button[aria-current="page"] svg{color:var(--brand)}
.nav .badge{margin-left:auto;background:linear-gradient(135deg,var(--a1),var(--a2));color:var(--on-a);font-size:11px;font-weight:800;border-radius:999px;padding:1px 7px}
.side .grow{flex:1}
.shift{background:var(--surface-2);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;align-items:center;gap:10px;position:relative}
.shift .av{width:38px;height:38px;border-radius:12px;background:#f3d8a8;color:#5a3a00;display:grid;place-items:center;font-weight:800;flex:none}
.shift b{display:block;font-size:14px;color:var(--fg)}
.shift span{font-size:12px;color:var(--muted)}
.iconbtn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--muted);display:grid;place-items:center;margin-left:auto}
.iconbtn svg{width:18px;height:18px}

/* ---------- main ---------- */
main{min-width:0;min-height:0;overflow:auto;border-radius:24px;padding:22px 24px 28px;scrollbar-width:thin}
.topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.topbar h1{font-family:var(--display);font-size:26px;font-weight:700;letter-spacing:-.02em;margin:0;line-height:1.15;text-wrap:balance}
.topbar .sub{color:var(--muted);font-size:13.5px;margin-top:3px}
.topbar .grow{flex:1}
.tb-btn{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;position:relative;box-shadow:var(--shadow-sm)}
.tb-btn svg{width:20px;height:20px;color:var(--muted)}
.tb-btn i{position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--bad);border:2px solid var(--surface)}
.status{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:13px;box-shadow:var(--shadow-sm)}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 0 0 var(--good);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}

.searchrow{display:flex;gap:10px;margin-bottom:14px}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:10px;height:52px;padding:0 8px 0 16px;border-radius:16px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-sm);transition:border-color .15s,box-shadow .15s}
.search:focus-within{border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}
.search svg{width:20px;height:20px;color:var(--faint)}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:15px;height:100%}
.kbd{font-size:11.5px;font-weight:700;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:3px 7px}
.scanbtn{height:52px;padding:0 18px;border-radius:16px;border:0;background:linear-gradient(135deg,var(--pm),var(--pd));color:#fff;box-shadow:0 10px 20px -10px color-mix(in srgb,var(--pb) 80%,transparent);display:flex;align-items:center;gap:9px;font-weight:700}
.scanbtn svg{width:20px;height:20px}

.cats{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 16px;scrollbar-width:none;margin:0 -2px}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:7px 14px 7px 8px;border-radius:14px;font-weight:600;font-size:13.5px;color:var(--fg);transition:all .15s}
.cat .ce{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:17px}
.cat small{color:var(--faint);font-weight:700;font-size:12px}
.cat[aria-pressed="true"]{background:linear-gradient(135deg,var(--pm),var(--pd));border-color:transparent;color:#fff;box-shadow:0 8px 18px -10px color-mix(in srgb,var(--pb) 80%,transparent)}
.cat[aria-pressed="true"] small{color:inherit;opacity:.7}
.cat[aria-pressed="true"] .ce{background:rgba(255,255,255,.18)!important}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:14px}
.prod{position:relative;text-align:left;border:1.5px solid transparent;background:var(--surface);border-radius:20px;padding:10px 10px 12px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow-sm);transition:transform .16s cubic-bezier(.3,.7,.4,1.4),box-shadow .16s,border-color .16s}
.prod:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.prod:active{transform:scale(.97)}
.prod.in{border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}
.prod.dim{opacity:.5}
.pimg{aspect-ratio:1/0.78;max-width:100%;border-radius:14px;display:grid;place-items:center;font-size:52px;position:relative;overflow:hidden}
.pimg::after{content:"";position:absolute;inset:auto 18% 10% 18%;height:12%;border-radius:50%;background:rgba(0,0,0,.08);filter:blur(6px)}
.pimg span{position:relative;z-index:1;filter:drop-shadow(0 6px 8px rgba(0,0,0,.12));transition:transform .2s}
.prod:hover .pimg span{transform:scale(1.08) rotate(-3deg)}
.pname{font-weight:700;font-size:14px;line-height:1.25;padding:0 4px}
.pfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 4px}
.pprice{font-family:var(--display);font-weight:700;font-size:16px}
.punit{font-size:12px;color:var(--muted);font-weight:500;padding:0 4px;margin-top:-8px}
.padd{width:34px;height:34px;border-radius:11px;background:var(--surface-3);display:grid;place-items:center;transition:background .15s}
.padd svg{width:16px;height:16px}
.prod:hover .padd,.prod.in .padd{background:var(--brand);color:var(--on-brand)}
.qb{position:absolute;top:16px;right:16px;z-index:2;min-width:28px;height:28px;padding:0 8px;border-radius:999px;background:linear-gradient(135deg,var(--a1),var(--a2));color:var(--on-a);box-shadow:0 4px 10px -3px color-mix(in srgb,var(--a2) 70%,transparent);font-weight:800;font-size:13px;display:grid;place-items:center;animation:bump .3s}
@keyframes bump{40%{transform:scale(1.3)}}
.tag{position:absolute;top:16px;left:16px;z-index:2;font-size:11px;font-weight:800;padding:3px 8px;border-radius:8px;background:var(--warn-soft);color:var(--warn)}
.tag.out{background:var(--bad-soft);color:var(--bad)}

/* ---------- order panel ---------- */
.order{background:var(--surface);border-radius:24px;display:flex;flex-direction:column;min-height:0;box-shadow:var(--shadow);overflow:hidden}
.o-head{padding:20px 20px 14px;display:flex;align-items:flex-start;gap:10px}
.o-head h2{font-family:var(--display);font-weight:700;font-size:20px;margin:0;letter-spacing:-.01em}
.o-head .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.o-head .grow{flex:1}
.mini{height:34px;padding:0 12px;border-radius:11px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:12.5px;display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
.mini svg{width:15px;height:15px}
.mini:hover{color:var(--fg);border-color:var(--line-2)}
.held{display:flex;gap:6px;padding:0 20px 10px;flex-wrap:wrap}
.held button{border:1px dashed var(--line-2);background:var(--surface-2);border-radius:10px;padding:5px 10px;font-size:12px;font-weight:700;color:var(--muted)}
.custbtn{margin:0 20px 12px;display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:16px;border:1px solid var(--line);background:var(--surface-2);text-align:left;transition:border-color .15s}
.custbtn:hover{border-color:var(--line-2)}
.av{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:13.5px;flex:none}
.custbtn .cn{font-weight:700;font-size:14px;display:block}
.custbtn .cs{font-size:12px;color:var(--muted)}
.custbtn .chev{margin-left:auto;color:var(--faint)}
.lines{flex:1;min-height:0;overflow:auto;padding:0 12px}
.line{display:flex;align-items:center;gap:12px;padding:10px 8px;border-radius:14px;transition:background .4s}
.line+.line{border-top:1px solid var(--line)}
.line.flash{background:var(--gold-soft)}
.lthumb{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;font-size:24px;flex:none}
.linfo{flex:1;min-width:0}
.lname{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lsub{font-size:12px;color:var(--muted)}
.lright{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.ltotal{font-weight:800;font-size:14.5px}
.step{display:inline-flex;align-items:center;background:var(--surface-3);border-radius:10px;padding:2px}
.step button{width:26px;height:26px;border:0;border-radius:8px;background:transparent;font-weight:800;font-size:15px;line-height:1;display:grid;place-items:center}
.step button:hover{background:var(--surface)}
.step span{min-width:26px;text-align:center;font-weight:800;font-size:13px}
.empty{text-align:center;padding:36px 18px;color:var(--muted)}
.empty .ei{width:78px;height:78px;border-radius:24px;background:var(--surface-2);display:grid;place-items:center;margin:0 auto 14px;font-size:36px}
.empty b{display:block;color:var(--fg);font-family:var(--display);font-size:16px;margin-bottom:4px}
.sum{margin:10px 12px 12px;background:var(--surface-2);border-radius:20px;padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px}
.r{display:flex;justify-content:space-between;gap:10px;font-size:13.5px}
.r .k{color:var(--muted)}
.chips{display:flex;gap:6px}
.chips button{flex:1;height:32px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:12.5px;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--gold-soft);border-color:var(--gold);color:var(--warn)}
.dash{border-top:1.5px dashed var(--line-2);margin:4px 0}
.grand{display:flex;justify-content:space-between;align-items:baseline}
.grand span{font-weight:700;font-size:15px}
.grand b{font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:-.02em}
.paybtn{height:58px;border:0;border-radius:16px;background:linear-gradient(135deg,var(--a1),var(--a2));color:var(--on-a);font-weight:800;font-size:16.5px;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 12px 24px -10px color-mix(in srgb,var(--a2) 75%,transparent);transition:transform .12s,box-shadow .12s;margin-top:4px}
.paybtn:hover{transform:translateY(-1px);box-shadow:0 16px 28px -10px color-mix(in srgb,var(--a2) 85%,transparent)}
.paybtn:active{transform:scale(.98)}
.paybtn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none;transform:none}
.paybtn svg{width:20px;height:20px}

/* ---------- generic blocks ---------- */
.card{background:var(--surface);border-radius:var(--r);padding:18px;box-shadow:var(--shadow-sm);min-width:0}
.card h3{margin:0;font-family:var(--display);font-weight:700;font-size:16.5px;letter-spacing:-.01em}
.card .ch{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.card .ch .grow{flex:1}
.link{border:0;background:none;color:var(--brand);font-weight:700;font-size:13px;padding:0}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:12px}
.kpi .k{font-size:12.5px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:8px}
.kpi .ki{width:30px;height:30px;border-radius:10px;display:grid;place-items:center}
.kpi .ki svg{width:16px;height:16px}
.kpi .v{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:-.02em;margin-top:10px}
.delta{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:800;padding:2px 7px;border-radius:7px;margin-top:4px}
.delta.up{background:var(--good-soft);color:var(--good)} .delta.down{background:var(--bad-soft);color:var(--bad)}
.cols{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:12px;margin-bottom:12px}
.cols.cr{grid-template-columns:minmax(0,1fr) minmax(0,1.5fr)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--good-soft);color:var(--good)} .pill.low{background:var(--warn-soft);color:var(--warn)} .pill.out{background:var(--bad-soft);color:var(--bad)} .pill.info{background:var(--info-soft);color:var(--info)}
.tw{overflow-x:auto;margin:0 -6px}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:14px}
th{text-align:left;font-size:12px;font-weight:700;color:var(--muted);padding:8px 12px;white-space:nowrap;border-bottom:1px solid var(--line)}
td{padding:11px 12px;white-space:nowrap;border-bottom:1px solid var(--line)}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--surface-2)}
.ic{display:flex;align-items:center;gap:11px}
.ic .e{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:20px;flex:none}
.bar{height:8px;border-radius:999px;background:var(--surface-3);overflow:hidden;width:110px}
.bar i{display:block;height:100%;border-radius:inherit;background:var(--good)}
.bar i.low{background:var(--warn)} .bar i.out{background:var(--bad)}
.btn{height:42px;padding:0 16px;border-radius:13px;border:0;background:linear-gradient(135deg,var(--pm),var(--pd));color:#fff;box-shadow:0 8px 18px -10px color-mix(in srgb,var(--pb) 80%,transparent);font-weight:700;display:inline-flex;align-items:center;gap:8px}
.btn svg{width:18px;height:18px}
.btn.ghost{background:var(--surface);color:var(--fg);border:1px solid var(--line);box-shadow:none}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:3px}
.seg button{border:0;background:transparent;height:34px;padding:0 14px;border-radius:10px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand)}
.note{font-size:12.5px;color:var(--muted)}
.mut{color:var(--muted)}

/* home */
.hero{grid-column:span 2;background:linear-gradient(135deg,var(--pd),var(--pm) 75%,color-mix(in srgb,var(--pm) 80%,#ffffff));color:#effaf6;border-radius:22px;padding:22px 24px;position:relative;overflow:hidden;display:flex;gap:20px;flex-wrap:wrap;align-items:flex-end}
.hero::after{content:"";position:absolute;right:-80px;top:-90px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--a1) 35%,transparent),transparent 62%)}
.hero .hk{font-size:13px;font-weight:600;opacity:.75}
.hero .hv{font-family:var(--display);font-weight:800;font-size:44px;letter-spacing:-.03em;line-height:1.05;margin:6px 0 8px}
.hero .hs{display:flex;gap:18px;flex-wrap:wrap;font-size:13px}
.hero .hs b{display:block;font-size:17px;font-family:var(--display)}
.hero .hs span{opacity:.7}
.hero .spark{flex:1;min-width:220px;position:relative;z-index:1}
.hero .up{background:rgba(255,255,255,.16);color:#fff}
.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.qa{border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:10px;transition:transform .15s,box-shadow .15s}
.qa:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.qa .qi{width:38px;height:38px;border-radius:12px;display:grid;place-items:center}
.qa .qi svg{width:19px;height:19px}
.qa b{font-size:14px}
.qa span{font-size:12px;color:var(--muted);margin-top:-8px}
.homegrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:10px 0}
.li+.li{border-top:1px solid var(--line)}
.li .grow{flex:1;min-width:0}
.li b{font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li small{font-size:12px;color:var(--muted)}
.paysplit{display:flex;height:12px;border-radius:999px;overflow:hidden;gap:3px;margin:6px 0 14px}
.legend{display:flex;flex-direction:column;gap:9px}
.legend div{display:flex;align-items:center;gap:10px;font-size:13.5px}
.legend .sw{width:10px;height:10px;border-radius:3px;flex:none}
.legend .grow{flex:1}

/* customers */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.ccard{display:flex;flex-direction:column;gap:14px}
.ccard .top{display:flex;align-items:center;gap:12px}
.ccard .top b{font-size:15px;display:block}
.ccard .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:var(--surface-2);border-radius:14px;padding:10px}
.ccard .stats div{font-size:11.5px;color:var(--muted);font-weight:600}
.ccard .stats b{display:block;font-size:15px;color:var(--fg);font-family:var(--display)}

/* ---------- modal ---------- */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(5,16,13,.5);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px;animation:fade .18s}
@keyframes fade{from{opacity:0}}
.modal{background:var(--surface);border-radius:28px;width:min(820px,100%);max-height:calc(100% - 8px);overflow:auto;box-shadow:var(--shadow-lg);animation:rise .25s cubic-bezier(.2,.8,.3,1)}
.modal.sm{width:min(460px,100%)}
@keyframes rise{from{transform:translateY(16px) scale(.98);opacity:0}}
.m-head{display:flex;align-items:center;gap:12px;padding:20px 22px 0}
.m-head h2{flex:1;margin:0;font-family:var(--display);font-size:21px;font-weight:700;letter-spacing:-.01em}
.xbtn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.xbtn svg{width:16px;height:16px}
.m-body{padding:18px 22px 22px}
.paygrid{display:grid;grid-template-columns:250px minmax(0,1fr);gap:18px}
.duebox{background:linear-gradient(135deg,var(--pd),var(--pm));color:#fff;border-radius:20px;padding:16px 18px;margin-bottom:12px}
.duebox small{font-size:12px;opacity:.7;font-weight:600}
.duebox b{display:block;font-family:var(--display);font-size:34px;font-weight:800;letter-spacing:-.02em;margin-top:2px}
.methods{display:flex;flex-direction:column;gap:8px}
.meth{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);text-align:left;transition:all .15s}
.meth .mi{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none}
.meth .mi svg{width:20px;height:20px}
.meth b{display:block;font-size:14px}
.meth small{font-size:11.5px;color:var(--muted)}
.meth[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.payarea{background:var(--surface-2);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.display{background:var(--surface);border-radius:16px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border:1.5px solid var(--line)}
.display small{font-size:12px;color:var(--muted);font-weight:600;display:block}
.display b{font-family:var(--display);font-size:28px;font-weight:800}
.notes{display:flex;gap:8px;flex-wrap:wrap}
.notes button{border:0;border-radius:12px;padding:8px 12px;font-weight:800;font-size:13.5px;background:#e3efe2;color:#1f4d2a;box-shadow:inset 0 -2px 0 rgba(0,0,0,.08)}
.notes button:nth-child(2){background:#f5e7cf;color:#5b3d00}
.notes button:nth-child(3){background:#e6e2f3;color:#3a2f66}
.notes button:nth-child(4){background:#f6dbe0;color:#6d1f30}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keypad button{height:52px;border-radius:14px;border:0;background:var(--surface);font-family:var(--display);font-size:20px;font-weight:700;box-shadow:var(--shadow-sm);transition:transform .08s}
.keypad button:active{transform:scale(.95);background:var(--surface-3)}
.change{display:flex;justify-content:space-between;align-items:center;background:var(--good-soft);color:var(--good);border-radius:14px;padding:12px 16px;font-weight:700}
.change b{font-family:var(--display);font-size:22px}
.change.neg{background:var(--bad-soft);color:var(--bad)}
.qrwrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.qrbox{background:#fff;border-radius:20px;padding:12px;box-shadow:var(--shadow);position:relative}
.qrbox canvas{display:block;width:170px;height:170px}
.qrbox .qlogo{position:absolute;inset:0;margin:auto;width:40px;height:40px;border-radius:12px;background:linear-gradient(145deg,var(--pm),var(--pd));display:grid;place-items:center;border:4px solid #fff}
.qrbox .qlogo svg{width:18px;height:18px;color:#fff}
.apps{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.apps span{font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:8px;background:var(--surface);border:1px solid var(--line)}
.waiting{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--info);font-size:13.5px;margin-top:12px}
.spin{width:16px;height:16px;border-radius:50%;border:2.5px solid var(--info-soft);border-top-color:var(--info);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cardviz{width:100%;max-width:300px;aspect-ratio:1.6;border-radius:18px;background:linear-gradient(135deg,#1d2b3a,#384b63);color:#fff;padding:18px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--shadow)}
.cardviz .chip{width:38px;height:28px;border-radius:6px;background:linear-gradient(135deg,#e9cf8b,#b8954a)}
.confirm{height:56px;border:0;border-radius:16px;background:linear-gradient(135deg,var(--pm),var(--pd));color:#fff;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;gap:10px;width:100%}
.confirm svg{width:20px;height:20px}
.confirm:disabled{opacity:.45;cursor:not-allowed}

/* sizes, weight, apple-style success */
.pfrom{font-size:11px;font-weight:600;color:var(--muted);margin:0 3px}
.ptag{font-size:11px;font-weight:700;color:var(--pb,var(--fg));background:var(--surface-2,rgba(0,0,0,.05));border-radius:8px;padding:3px 7px;margin-left:auto;margin-right:6px;white-space:nowrap}
.wbtn{border:0;background:transparent;font-weight:700;font-size:12.5px;padding:0 8px;white-space:nowrap}
.sizes{display:flex;flex-direction:column;gap:8px}
.szrow{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;background:var(--surface)}
.szrow.on{border-color:var(--pb,var(--fg));background:var(--surface-2,transparent)}.szrow.dim{opacity:.5}
.szinfo{flex:1;min-width:0}.szinfo b{display:block;font-size:16px}.szinfo small{color:var(--muted);font-size:12px}
.szp{font-size:16px}
.szadd{border:0;border-radius:12px;padding:9px 16px;font-weight:800;background:linear-gradient(135deg,var(--a1),var(--a2));color:var(--on-a)}
.wseg{display:inline-flex;gap:4px;padding:4px;border-radius:14px;border:1px solid var(--line);margin-bottom:12px}
.wseg button{border:0;background:transparent;border-radius:10px;padding:7px 14px;font-weight:700;font-size:13px;color:var(--muted)}
.wseg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.wdisp{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;border:1.5px solid var(--line);border-radius:18px;padding:14px 16px;background:var(--surface-2,transparent)}
.wdisp small{display:block;font-size:12px;color:var(--muted)}.wbig{font-family:var(--display);font-size:36px;font-weight:800;line-height:1.1}.wsub{font-family:var(--display);font-size:20px;font-weight:800}
.wread{margin-top:8px;font-size:12.5px;font-weight:700;color:var(--good)}.wwarn{margin-top:8px;font-size:12.5px;font-weight:700;color:var(--bad)}
.wpre{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:12px 0 8px}
.wpre button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 2px;font-weight:700;font-size:12.5px}
.wpad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.wpad button{border:1px solid var(--line);background:var(--surface);border-radius:14px;height:46px;font-size:18px;font-weight:700}
.wscale{width:100%;margin:10px 0;border:1.5px dashed var(--line);background:transparent;border-radius:14px;padding:11px;font-weight:700}
.confirm:disabled{opacity:.5}
.apm{padding:0}.apbox{display:flex;flex-direction:column;align-items:center;text-align:center;padding:44px 20px 48px;gap:16px;min-height:340px;justify-content:center}
.ap{width:104px;height:104px}.ap svg{width:100%;height:100%;overflow:visible}
.ap .trk{fill:none;stroke:var(--line);stroke-width:5}
.ap .ring{fill:none;stroke:var(--pb,#2f4fe0);stroke-width:5;stroke-linecap:round;stroke-dasharray:276.5;stroke-dashoffset:200;transform-origin:50px 50px;animation:aspin .9s linear infinite;transition:stroke-dashoffset .45s cubic-bezier(.4,0,.2,1),stroke .3s}
.ap .fill{fill:#1f9d55;transform-origin:50px 50px;transform:scale(0);transition:transform .38s cubic-bezier(.34,1.56,.64,1) .38s}
.ap .tick{fill:none;stroke:#fff;stroke-width:7;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;transition:stroke-dashoffset .35s cubic-bezier(.65,0,.35,1) .62s}
@keyframes aspin{to{transform:rotate(360deg)}}
.ap.ok .ring{animation:none;transform:rotate(-90deg);stroke-dashoffset:0;stroke:#1f9d55}
.ap.ok .fill{transform:scale(1)}.ap.ok .tick{stroke-dashoffset:0}
.ap.ok{animation:appop .5s cubic-bezier(.34,1.56,.64,1) .5s}@keyframes appop{40%{transform:scale(1.07)}}
.apt{font-weight:700;font-size:15px}.apt.big{font-family:var(--display);font-size:32px;font-weight:800;animation:rise .3s}
.apt.big small{display:block;font-family:var(--body,inherit);font-size:13px;font-weight:700;color:#1f9d55;margin-bottom:2px}
.aps{color:var(--muted);font-size:13px;margin-top:-10px}
@media (prefers-reduced-motion:reduce){.ap .ring{animation-duration:3s}}
/* success + receipt */
.done{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start}
.tick{width:84px;height:84px;border-radius:50%;background:var(--good-soft);display:grid;place-items:center;margin-bottom:14px}
.tick svg{width:44px;height:44px;color:var(--good)}
.tick path{stroke-dasharray:30;stroke-dashoffset:30;animation:draw .5s .15s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.done h3{font-family:var(--display);font-size:26px;margin:0 0 4px;letter-spacing:-.02em}
.share{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0 14px}
.share button{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:7px;font-weight:700;font-size:12.5px}
.share button svg{width:22px;height:22px}
.share .wa{color:#1a9e4b}
.receipt{background:#fffdf6;color:#222;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:12px;line-height:1.5;padding:18px 18px 24px;border-radius:4px;box-shadow:0 10px 30px -8px rgba(0,0,0,.25);position:relative;transform:rotate(.6deg)}
.receipt::after{content:"";position:absolute;left:0;right:0;bottom:-9px;height:10px;background:radial-gradient(circle at 6px 0,transparent 6px,#fffdf6 6.5px) 0 0/12px 10px repeat-x}
.receipt .c{text-align:center}
.receipt hr{border:0;border-top:1px dashed #aaa;margin:8px 0}
.receipt .rr{display:flex;justify-content:space-between;gap:8px}
.receipt .big{font-size:15px;font-weight:800}
.receipt .ttl{letter-spacing:.18em;font-size:10.5px;margin:8px 0}
.receipt .bi{display:grid;grid-template-columns:minmax(0,1fr) 26px 48px 56px;gap:4px;margin-top:4px}
.receipt .bi span:not(:first-child),.receipt .bg span:not(:first-child){text-align:right}
.receipt .bi small{display:block;opacity:.65;font-size:10.5px}
.receipt .bi.h,.receipt .bg.h{font-size:10px;text-transform:uppercase;opacity:.7}
.receipt .bg{display:grid;grid-template-columns:34px 1fr 1fr 1fr;gap:4px;font-size:11px}
.receipt .wd{font-size:10.5px;font-style:italic;opacity:.75}
.receipt .bc{height:34px;width:170px;margin:12px auto 0;background:repeating-linear-gradient(90deg,#111 0 2px,transparent 2px 4px,#111 4px 5px,transparent 5px 8px,#111 8px 11px,transparent 11px 12px)}
.receipt.kirana{font-family:var(--body,"Plus Jakarta Sans",sans-serif);padding-top:0;overflow:hidden;transform:none}
.receipt.kirana .awn{display:block;width:calc(100% + 36px);height:64px;margin:0 -18px 6px}
.receipt.kirana .kshop{font-family:var(--display);font-weight:800;font-size:19px;color:#163a7a}
.receipt.kirana .kmut{font-size:10.5px;opacity:.65}
.receipt .khr{border-top:2px solid #163a7a;margin:8px 0}
.bseg{display:inline-flex;gap:4px;padding:4px;border-radius:12px;background:var(--surface-2,rgba(0,0,0,.05));border:1px solid var(--line);margin-bottom:12px}
.bseg button{border:0;background:transparent;border-radius:9px;padding:6px 14px;font-weight:700;font-size:12.5px;color:var(--muted,inherit)}
.bseg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}

.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:700;font-size:13.5px;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:10px;animation:rise .25s;max-width:calc(100% - 32px)}
.toast svg{width:18px;height:18px;color:var(--gold)}

.swatches{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.sw-btn{border:2px solid var(--line);background:var(--surface);border-radius:18px;padding:8px;text-align:left;display:flex;flex-direction:column;gap:8px;transition:transform .15s,border-color .15s}
.sw-btn:hover{transform:translateY(-2px)}
.sw-btn[aria-pressed="true"]{border-color:var(--fg)}
.sw-prev{height:64px;border-radius:12px;position:relative;overflow:hidden}
.sw-prev i{position:absolute;right:8px;bottom:8px;width:26px;height:26px;border-radius:9px}
.sw-btn b{font-size:13px;padding:0 4px 2px;display:flex;align-items:center;gap:6px}
.sw-btn b svg{width:14px;height:14px}
.modeseg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.modeseg button{height:44px;border-radius:13px;border:1.5px solid var(--line);background:var(--surface);font-weight:700}
.modeseg button[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}
.gw{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:9px 12px;font-size:12.5px}
.gw .gl{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--pm),var(--pd));color:#fff;display:grid;place-items:center;font-weight:800;font-size:12px;flex:none}
.gw b{font-size:13px}
.gw code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;color:var(--muted);background:var(--surface-2);padding:2px 6px;border-radius:6px}
.gw .grow{flex:1}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps span{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:5px 9px;border-radius:9px;background:var(--surface);border:1px solid var(--line);color:var(--faint)}
.steps span.on{color:var(--info);border-color:color-mix(in srgb,var(--info) 40%,transparent);background:var(--info-soft)}
.steps span.ok{color:var(--good);border-color:color-mix(in srgb,var(--good) 40%,transparent);background:var(--good-soft)}
.paid{display:flex;align-items:center;gap:14px;background:var(--good-soft);color:var(--good);border-radius:18px;padding:16px;animation:rise .3s}
.paid .pc{width:52px;height:52px;border-radius:50%;background:var(--good);color:#fff;display:grid;place-items:center;flex:none}
.paid .pc svg{width:28px;height:28px}
.paid b{display:block;font-family:var(--display);font-size:20px}
.paid span{font-size:12.5px;font-weight:600;color:var(--fg)}
.qrbox.dim canvas{opacity:.35}
.manual{border:0;background:none;color:var(--muted);font-weight:700;font-size:12.5px;text-decoration:underline;padding:0;align-self:flex-start}
.warnbox{display:flex;gap:10px;background:var(--warn-soft);color:var(--warn);border-radius:14px;padding:12px 14px;font-size:12.5px;font-weight:600;line-height:1.45}
.mbar,.tabbar{display:none}

/* ---------- tablet: icon rail ---------- */
@media (max-width:1240px){
  .shell{grid-template-columns:84px minmax(0,1fr) 380px}
  .shell.wide{grid-template-columns:84px minmax(0,1fr)}
  .side{padding:16px 10px;align-items:center}
  .brand{padding:2px 0 14px}.wordmark,.navlabel,.shift>div,.nav span,.nav .badge{display:none}
  .nav button{justify-content:center;padding:12px}
  .nav button[aria-current="page"]::before{left:-10px}
  .shift{padding:0;background:none;border:0;flex-direction:column}
  .shift .av{display:none}
  .iconbtn{margin:0}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .homegrid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:1000px){
  .shell,.shell.wide{grid-template-columns:84px minmax(0,1fr)}
  .order{position:fixed;left:0;right:0;bottom:0;z-index:40;border-radius:28px 28px 0 0;max-height:90%;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.3,1);box-shadow:var(--shadow-lg);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .order.open{transform:none}
  .order .grab{display:block}
  .mbar{display:flex;position:fixed;z-index:30;background:linear-gradient(135deg,var(--pm),var(--pd))!important;color:#fff!important;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));height:62px;border:0;border-radius:20px;background:var(--fg);color:var(--bg);align-items:center;gap:12px;padding:0 10px 0 18px;font-weight:700;box-shadow:var(--shadow-lg);animation:rise .25s}

  <path d="${d} L${last[0]} ${Y(0)} L${pl} ${Y(0)}Z" fill="url(#ag)"/>
  <path d="${d}" fill="none" style="stroke:var(--brand)" stroke-width="2.8" stroke-linecap="round"/>
  ${data.map((p,i)=>n<=7||i%5===0||i===n-1?`<text x="${X(i)}" y="${H-8}" text-anchor="middle" font-size="11.5" style="fill:var(--muted)">${p[0]}</text>`:"").join("")}
  <line x1="${last[0]}" x2="${last[0]}" y1="${last[1]}" y2="${Y(0)}" style="stroke:var(--gold)" stroke-dasharray="3 3"/>

/* ---------- render ---------- */
function render(){
  renderNav();
  const isBill=S.view==="billing";
  $("#shell").classList.toggle("wide",!isBill);
  const order=$("#order");order.hidden=!isBill;
  $("#main").innerHTML={home:renderHome,billing:renderBilling,orders:renderOrders,credit:renderCredit,stock:renderStock,reports:renderReports,customers:renderCustomers,settings:renderSettings}[S.view]();
  if(isBill){order.innerHTML=renderOrder();order.classList.toggle("open",S.sheet)}
  let ss=$(".sheetscrim");if(S.sheet&&isBill&&!ss){ss=document.createElement("div");ss.className="sheetscrim";ss.onclick=()=>{S.sheet=false;render()};document.body.appendChild(ss)}else if((!S.sheet||!isBill)&&ss)ss.remove();
  const t=totals(),mb=$("#mbar");
  mb.hidden=!isBill||!S.cart.size||S.sheet;
  mb.innerHTML=`<span class="cnt num">${t.items}</span><span class="grow">View bill</span><span class="go num">${inr(t.total)}</span>`;
  const q=$("#q");if(q&&S._fq){q.focus();q.setSelectionRange(q.value.length,q.value.length);S._fq=false}
  if(S.flash){const id=S.flash;setTimeout(()=>{if(S.flash===id){S.flash=null;const el=document.querySelector(".line.flash");el&&el.classList.remove("flash")}},600)}
}
function toast(msg){document.querySelectorAll(".toast").forEach(t=>t.remove());const d=document.createElement("div");d.className="toast";d.innerHTML=I.check.replace("<svg",'<svg width="18" height="18"')+`<span>${msg}</span>`;document.body.appendChild(d);setTimeout(()=>d.remove(),2400)}
function add(id){const p=ln(id);if(!p.stock)return toast(p.name+" "+(p.vi!=null?p.unit+" ":"")+"is out of stock");
  const q=(S.cart.get(id)||0)+1;if(q>p.stock)return toast("Only "+p.stock+" × "+p.name+" "+(p.vi!=null?p.unit:"")+" in stock");S.cart.set(id,q);S.flash=id;render()}
function tap(id){const p=P.find(x=>x.id===id);if(!p.stock)return toast(p.name+" is out of stock");if(p.v)return openSizes(id);if(p.kg)return openWeight(id);add(id)}
/* pick a saved size */
function openSizes(id){const p=P.find(x=>x.id===id),pk=l=>{const m=l.match(/([\d.]+)\s*(kg|g|L|ml|pcs)/);if(!m)return"";const n=+m[1],u=m[2];return u==="kg"||u==="g"?"per kg ":u==="L"||u==="ml"?"per L ":"each "};
  const per=(v)=>{const m=v.l.match(/([\d.]+)\s*(kg|g|L|ml|pcs)/);if(!m)return"";let n=+m[1];const u=m[2];if(u==="g"||u==="ml")n/=1000;return inr(Math.round(v.p/n*(u==="pcs"?1:1)))+(u==="pcs"?" each":u==="kg"||u==="g"?"/kg":"/L")};
  modal((p.img?"":p.e+" ")+p.name,`<div class="sizes">${p.v.map((v,i)=>{const k=id+"#"+i,q=S.cart.get(k)||0;return `<div class="szrow ${q?"on":""} ${v.s?"":"dim"}">
    <div class="szinfo"><b>${v.l}</b><small>${per(v)} · ${v.s?v.s+" in stock":"Out of stock"}</small></div><b class="szp num">${inr(v.p)}</b>
    ${q?`<span class="step"><button data-szd="${k}" aria-label="Remove one">−</button><span class="num">${q}</span><button data-sza="${k}" aria-label="Add one">+</button></span>`:`<button class="szadd" data-sza="${k}" ${v.s?"":"disabled"}>Add</button>`}</div>`}).join("")}</div>
    <p class="mut" style="margin:12px 2px 14px;font-size:13px">Bigger packs are cheaper per kg. Tap Add, then use + and − for more.</p><button class="confirm" id="szDone" style="background:linear-gradient(135deg,var(--a1),var(--a2));color:var(--on-a)">Done</button>`,"sm")}
/* sell loose items by weight or by rupee amount */
function openWeight(id,editK){const p=P.find(x=>x.id===id);S.wt={id,editK,mode:"w",buf:editK?String(+String(editK).split("@")[1]):"",read:false};drawWeight()}
function drawWeight(){const w=S.wt,p=P.find(x=>x.id===w.id),n=+w.buf||0,g=w.mode==="w"?n:Math.round(n/p.kg*1000),amt=w.mode==="w"?Math.round(p.kg*n/10)/100:n,over=g/1000>p.sk;
  const pre=w.mode==="w"?[[100,"100 g"],[250,"250 g"],[500,"500 g"],[1000,"1 kg"],[2000,"2 kg"]]:[[10,"₹10"],[20,"₹20"],[50,"₹50"],[100,"₹100"],[200,"₹200"]];
  modal((p.img?"":p.e+" ")+p.name,`<div class="wseg" role="group" aria-label="Sell by"><button data-wm="w" aria-pressed="${w.mode==="w"}">By weight</button><button data-wm="a" aria-pressed="${w.mode==="a"}">By amount ₹</button></div>
   <div class="wdisp"><div><small>${w.mode==="w"?"Weight":"Customer wants"}</small><div class="wbig num">${w.mode==="w"?(n>=1000?fmtW(n):(n||0)+" g"):"₹"+(n||0)}</div></div>
   <div style="text-align:right"><small>${w.mode==="w"?"Price":"You weigh"}</small><div class="wsub num">${w.mode==="w"?inr(amt):fmtW(g)}</div><small>${inr(p.kg)} per kg</small></div></div>
   ${w.read?`<div class="wread">⚖ Weight read from the scale</div>`:""}${over?`<div class="wwarn">Only ${p.sk} kg left in stock</div>`:""}
   <div class="wpre">${pre.map(([v,l])=>`<button data-wp="${v}">${l}</button>`).join("")}</div>
   <div class="wpad">${["1","2","3","4","5","6","7","8","9","00","0","⌫"].map(k=>`<button data-wk="${k}">${k}</button>`).join("")}</div>
   <button class="wscale" id="readScale">⚖ Read weight from scale</button>
   <button class="confirm" id="wAdd" ${g>0&&!over?"":"disabled"} style="background:linear-gradient(135deg,var(--a1),var(--a2));color:var(--on-a)">${w.editK?"Update":"Add"} ${g?fmtW(g)+" · "+inr(amt):""}</button>`,"sm")}
function go(v){S.view=v;S.sheet=false;$("#main").scrollTop=0;render()}

document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;const d=b.dataset;
  if(b.classList.contains("prod"))return tap(+d.id);
  if(d.v)return go(d.v);
  if(d.mv){closeModal();return go(d.mv)}
  if(d.c){S.cat=d.c;return render()}
  if(d.inc)return add(isNaN(+d.inc)?d.inc:+d.inc);
  if(d.sza){add(d.sza);return openSizes(+d.sza.split("#")[0])}
  if(d.szd){const q=S.cart.get(d.szd)-1;q?S.cart.set(d.szd,q):S.cart.delete(d.szd);render();return openSizes(+d.szd.split("#")[0])}
  if(d.editw){return openWeight(+d.editw.split("@")[0],d.editw)}
  if(d.wm){S.wt.mode=d.wm;S.wt.buf="";S.wt.read=false;return drawWeight()}
  if(d.wp){S.wt.buf=d.wp;S.wt.read=false;return drawWeight()}
  if(d.wk){const w=S.wt;w.read=false;if(d.wk==="⌫")w.buf=w.buf.slice(0,-1);else if(w.buf.length<5)w.buf=(w.buf+d.wk).replace(/^0+/,"");return drawWeight()}
  if(d.dec){const id=isNaN(+d.dec)?d.dec:+d.dec,q=S.cart.get(id)-1;q?S.cart.set(id,q):S.cart.delete(id);return render()}
  if(d.d){S.disc=+d.d;return render()}
  if(d.r){S.range=d.r;return render()}
  if(d.sf){S.stockFilter=d.sf;return render()}
  if(d.restock){const p=P.find(x=>x.id==d.restock);p.stock+=24;toast("Added 24 × "+p.name+" to stock");return render()}
  if(d.billfor){S.cust=+d.billfor;go("billing");return toast("New bill for "+CUST[S.cust].name)}
  if(d.remind){const c=CUST[+d.remind];return toast(`WhatsApp sent: "Namaste ${c.name.split(" ")[0]}, ${inr(c.due)} is due at Sharma General Store." (demo)`)}
  if(d.pal){setPalette(d.pal);openPalette();return render()}
  if(d.mode){const r=document.documentElement;if(d.mode==="system")delete r.dataset.theme;else r.dataset.theme=d.mode;try{d.mode==="system"?localStorage.removeItem("galla-theme"):localStorage.setItem("galla-theme",d.mode)}catch(e){}return openPalette()}
  if(d.cc){S.cc=+d.cc;return render()}
  if(d.collect){S.camt="";S.cm="Cash";return openCollect(+d.collect)}
  if(d.cfull){S.camt=String(CUST[S.ci].due);return openCollect(S.ci)}
  if(d.cnote){S.camt=String((+S.camt||0)+ +d.cnote);return openCollect(S.ci)}
  if(d.ckey){const k=d.ckey;S.camt=k==="⌫"?(S.camt||"").slice(0,-1):k==="C"?"":((S.camt||"")+k).replace(/^0+/,"").slice(0,6);return openCollect(S.ci)}
  if(d.cm){S.cm=d.cm;return openCollect(S.ci)}
  if(d.resend)return toast("Bill #"+d.resend+" sent again on WhatsApp (demo)");
  if(d.pickc!==undefined){S.cust=+d.pickc;closeModal();return render()}
  if(d.resume!==undefined){const h=S.held.splice(+d.resume,1)[0];if(S.cart.size)S.held.push({cart:new Map(S.cart),cust:S.cust,disc:S.disc,name:CUST[S.cust].name.split(" ")[0],total:totals().total});S.cart=h.cart;S.cust=h.cust;S.disc=h.disc;toast("Bill resumed");return render()}
  if(d.m){S.method=d.m;S.tendered="";return openPay()}
  if(d.note){S.tendered=String((+S.tendered||0)+ +d.note);return openPay(true)}
  if(d.key){const k=d.key;S.tendered=k==="⌫"?S.tendered.slice(0,-1):k==="C"?"":(S.tendered+k).replace(/^0+/,"").slice(0,6);return openPay(true)}
  switch(b.id){
    case"clear":S.cart.clear();S.disc=0;return render();
    case"hold":S.held.push({cart:new Map(S.cart),cust:S.cust,disc:S.disc,name:S.cust?CUST[S.cust].name.split(" ")[0]:"Walk-in",total:totals().total});S.cart=new Map();S.cust=0;S.disc=0;toast("Bill put on hold");return render();
    case"pay":return openPay();
    case"pickCust":return openCust();
    case"closeSheet":S.sheet=false;return render();
    case"mbar":S.sheet=true;return render();
    case"moreBtn":return openMore();
    case"scanBtn":{const avail=P.filter(p=>p.stock);const p=avail[Math.floor(Math.random()*avail.length)];toast("Beep! Scanned "+p.name);return add(p.id)}
    case"paletteBtn":return openPalette();
    case"gwManual":if(S.gw){S.gw.state="SUCCESS";S.gw.utr="MANUAL";clearInterval(S.gwTimer)}toast("Marked as paid by the cashier");return openPay(true);
    case"bell":return toast(lowCount()+" items are running low");
    case"addItem":return toast("The add-item form opens here in the real app");
    case"addCust":return toast("The add-customer form opens here in the real app");
    case"closeShift":return toast("Shift summary: "+inr(5250)+" cash should be in the galla");
    case"confirmPay":return finishPay();
    case"szDone":closeModal();return render();
    case"readScale":{const w=S.wt;w.mode="w";w.buf=String(Math.round((150+Math.random()*1300)/5)*5);w.read=true;return drawWeight()}
    case"wAdd":{const w=S.wt,p=P.find(x=>x.id===w.id),n=+w.buf,g=w.mode==="w"?n:Math.round(n/p.kg*1000);if(!g)return;if(w.editK)S.cart.delete(w.editK);
      const k=w.id+"@"+g;S.cart.set(k,1);S.flash=k;closeModal();toast(fmtW(g)+" "+p.name+" added");return render()}
    case"collectPay":{const c=CUST[S.ci],a=+S.camt;c.due-=a;c.ledger.push(["Today",S.cm==="UPI"?"Paid by UPI":"Paid in cash",-a]);if(!c.due)c.age=0;S.collected=(S.collected||0)+a;closeModal();toast(inr(a)+" received from "+c.name.split(" ")[0]+(c.due?" · "+inr(c.due)+" still due":" · all paid up"));return render()}
    case"newBill":S.cart=new Map();S.disc=0;S.cust=0;S.billNo++;S.sheet=false;S.method="cash";closeModal();return render();
    case"sendWa":return toast("Bill sent on WhatsApp"+(CUST[S.lastCust]?.phone?" to "+CUST[S.lastCust].phone:"")+" (demo)");

document.addEventListener("input",e=>{if(e.target.id==="q"){S.q=e.target.value;S._fq=true;render()}});

$("#themeBtn").onclick=()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;r.dataset.theme=dark?"light":"dark";try{localStorage.setItem("galla-theme",r.dataset.theme)}catch(e){}};

function closeModal(){$("#layer").innerHTML="";clearInterval(S.gwTimer);clearTimeout(S.apT)}
function openCust(){
  modal("Who is buying?",`<div class="list">${CUST.map((c,i)=>{const col=AVC[i%AVC.length];return `<button class="custbtn" data-pickc="${i}" style="margin:0 0 8px;width:100%;${i===S.cust?"border-color:var(--brand);background:var(--brand-soft)":""}">

const METHODS=[["cash","Cash","Notes & coins","--good-soft","--good"],["upi","UPI / QR","GPay, PhonePe, Paytm","--brand-soft","--brand"],["card","Card","Tap, insert or swipe","--info-soft","--info"],["split","Split","Part cash, part UPI","--gold-soft","--warn"],["khata","Credit","Pay later (khata)","--bad-soft","--bad"]];
/* ---------- YouPI PG gateway (simulated in this mockup) ----------
   Real app: POST /api/v1/payments {orderId, amount, method} -> paymentId; then GET /api/v1/payments/{id}
   until status is SUCCESS, and trust the HMAC-signed webhook on the server. */
const GWCODE={cash:"CASH_COUNTER",upi:"UPI",card:"CARD_COUNTER",split:"CASH_COUNTER + UPI"};
function gwSession(){
  const key=S.billNo+":"+S.method+":"+totals().total;
  if(S.gw&&S.gw.key===key)return S.gw;
  clearInterval(S.gwTimer);
  const digital=S.method==="upi"||S.method==="split";
  S.gw={key,id:"pay_"+Math.random().toString(36).slice(2,10),state:digital?"ACTIVE":"AWAITING_CASHIER",t0:Date.now(),utr:""};
  if(digital)S.gwTimer=setInterval(gwTick,500);
  return S.gw;
}
function gwTick(){
  const g=S.gw;if(!g||!$("#gwbox")){clearInterval(S.gwTimer);return}
  const el=Date.now()-g.t0,left=Math.max(0,300-Math.floor(el/1000)),tm=$("#gwTimer");
  if(tm)tm.textContent=Math.floor(left/60)+":"+String(left%60).padStart(2,"0");
  if(g.state==="ACTIVE"&&el>7000){g.state="PROCESSING";openPay(true)}
  else if(g.state==="PROCESSING"&&el>10000){g.state="SUCCESS";g.utr=String(429000000000+Math.floor(Math.random()*999999999));clearInterval(S.gwTimer);finishPay()}
}
const gwPill=g=>({ACTIVE:'<span class="pill info">Waiting</span>',PROCESSING:'<span class="pill low">Verifying</span>',SUCCESS:'<span class="pill ok">Paid</span>',AWAITING_CASHIER:'<span class="pill low">Cashier to approve</span>'}[g.state]);
function gwStrip(g){return `<div class="gw" id="gwbox"><span class="gl">₹</span><span><b>UPI</b> · <code>GALLA-${S.billNo}</code> · <code>${GWCODE[S.method]}</code></span><span class="grow"></span>${gwPill(g)}</div>`}
function upiBlock(g,amt){
  if(g.state==="SUCCESS")return `<div class="paid"><span class="pc">${I.check}</span><div><b class="num">${inr(amt)} received by UPI</b><span class="num">UTR ${g.utr} · checked by bank SMS and Gmail</span></div></div>`;
  return `<div class="qrwrap"><div class="qrbox ${g.state==="PROCESSING"?"dim":""}"><canvas id="qr" width="340" height="340" aria-label="UPI QR code (sample)"></canvas><span class="qlogo">${I.rupee}</span></div>
    <div style="flex:1;min-width:170px"><b style="font-size:17px;font-family:var(--display)">Scan to pay ${inr(amt)}</b><p class="note" style="margin:6px 0 0">This QR has the exact amount and bill number. Any UPI app works.</p>
    <div class="apps"><span>GPay</span><span>PhonePe</span><span>Paytm</span><span>BHIM</span></div>
    <div class="waiting">${g.state==="ACTIVE"?`<span class="spin"></span>Waiting for payment · <span class="num" id="gwTimer">5:00</span> left`:`<span class="spin"></span>Bank message received, checking amount…`}</div></div></div>
    <div class="steps"><span class="ok">${I.check.replace("<svg",'<svg width="12" height="12"')}QR created</span><span class="${g.state==="ACTIVE"?"on":"ok"}">Customer pays</span><span class="${g.state==="PROCESSING"?"on":""}">Bank SMS + Gmail check</span><span>Paid</span></div>
    <button class="manual" id="gwManual">Customer paid but it's not showing? Check your bank app, then mark as paid</button>`;
}
function openPay(keep){
  const t=totals(),m=S.method,c=CUST[S.cust];
  const scroll=keep&&$(".modal")?$(".modal").scrollTop:0;
  let area="",ok=true;const g=m==="khata"?null:gwSession();
  if(m==="cash"){
    const got=+S.tendered||0,chg=got-t.total;ok=!S.tendered||chg>=0;
    area=`<div class="display"><div><small>Cash received</small><b class="num">${S.tendered?inr(got):"₹0"}</b></div><div style="text-align:right"><small>Bill</small><b class="num" style="font-size:18px">${inr(t.total)}</b></div></div>
    <div class="notes">${[100,200,500,2000].map(n=>`<button data-note="${n}">+ ₹${n}</button>`).join("")}</div>
    <div class="keypad">${["1","2","3","4","5","6","7","8","9","C","0","⌫"].map(k=>`<button data-key="${k}" aria-label="${k==="⌫"?"Delete":k==="C"?"Clear":k}">${k}</button>`).join("")}</div>
    <div class="change ${S.tendered&&chg<0?"neg":""}"><span>${S.tendered&&chg<0?"Still to collect":"Change to return"}</span><b class="num">${S.tendered?inr(Math.abs(chg)):"₹0"}</b></div>`;
  }else if(m==="upi"){
    ok=g.state==="SUCCESS";
    area=upiBlock(g,t.total);
  }else if(m==="card"){
    area=`<div class="cardviz"><span class="chip"></span><div><div style="font-size:15px;letter-spacing:.18em" class="num">CARD</div><div style="font-size:11px;opacity:.7;margin-top:6px">Use your card machine</div></div></div>
    <div><b style="font-size:16px">Ask the customer to tap, insert or swipe</b><p class="note" style="margin:4px 0 0">The machine shows ${inr(t.total)}. When it prints "Approved", press the button below.</p></div>`;
  }else if(m==="split"){
    const half=Math.round(t.total/2/10)*10;
    area=`<b style="font-size:16px">Split ${inr(t.total)} two ways</b>
    <div class="display"><div><small>Cash</small><b class="num">${inr(half)}</b></div>${I.cash.replace("<svg",'<svg width="28" height="28" style="color:var(--good)"')}</div>
    ${upiBlock(g,t.total-half)}
    <p class="note" style="margin:0">Take the cash part first, then confirm the UPI part once you see it land in your bank app.</p>`;
    ok=g.state==="SUCCESS";
  }else if(S.cust>0&&c.due+t.total>c.limit){
    ok=false;
    area=`<div class="empty" style="padding:20px"><div class="ei">⚠️</div><b>Over the credit limit</b>${c.name.split(" ")[0]} already owes ${inr(c.due)}. This bill would take it to ${inr(c.due+t.total)}, above the ${inr(c.limit)} limit. Take part of it as cash or UPI with Split.</div>`;
  }else{
    ok=S.cust>0;
    area=ok?`<div class="display"><div><small>${c.name} owes now</small><b class="num">${inr(c.due)}</b></div><div style="text-align:right"><small>After this bill</small><b class="num" style="color:var(--bad)">${inr(c.due+t.total)}</b></div></div>
    <p class="note" style="margin:0">The amount goes into ${c.name.split(" ")[0]}'s khata. You can send a WhatsApp reminder from Customers.</p>`
    :`<div class="empty" style="padding:20px"><div class="ei">📒</div><b>Choose a customer first</b>Khata needs a name and phone number.<div style="margin-top:12px"><button class="btn" id="pickCust">${I.user}Choose customer</button></div></div>`;
  }
  modal("Take payment",`<div class="paygrid"><div>
    <div class="duebox"><div><small>Amount due · Bill #${S.billNo}</small><b class="num">${inr(t.total)}</b></div></div>
    <div class="methods" role="group" aria-label="Payment method">${METHODS.map(([k,l,s,bg,fg])=>`<button class="meth" data-m="${k}" aria-pressed="${m===k}"><span class="mi" style="background:var(${bg});color:var(${fg})">${I[k]}</span><span><b>${l}</b><small>${s}</small></span></button>`).join("")}</div>
  </div><div class="payarea">${g?gwStrip(g):`<div class="gw"><span class="gl">₹</span><span>Credit stays in Galla's khata book. No money moves now.</span></div>`}${area}
    <button class="confirm" id="confirmPay" ${ok?"":"disabled"}>${I.check}${m==="khata"?"Add "+inr(t.total)+" to khata":m==="upi"?(ok?"Continue to bill":"Waiting for payment…"):m==="split"?(ok?"Approve cash and finish":"Waiting for the UPI part…"):"Approve "+inr(t.total)}</button></div></div>`);
  if($("#qr"))drawQR();
  if(scroll)$(".modal").scrollTop=scroll;
}
function drawQR(){ // decorative QR-style pattern for the mockup, not a real payment code
  const c=$("#qr"),x=c.getContext("2d"),n=29,s=340/n,cs=getComputedStyle(document.documentElement),DK=cs.getPropertyValue("--pd").trim()||"#141b4d",AC=cs.getPropertyValue("--a2").trim()||"#ff6b3d";x.fillStyle="#fff";x.fillRect(0,0,340,340);
  let seed=S.billNo*7919;const rnd=()=>(seed=(seed*9301+49297)%233280)/233280;
  x.fillStyle=DK;for(let i=0;i<n;i++)for(let j=0;j<n;j++)if(rnd()>.5){x.beginPath();x.roundRect?x.roundRect(i*s+.6,j*s+.6,s-1.2,s-1.2,2):x.rect(i*s,j*s,s,s);x.fill()}
  [[0,0],[n-7,0],[0,n-7]].forEach(([a,b])=>{x.fillStyle="#fff";x.fillRect((a-.5)*s,(b-.5)*s,8*s,8*s);x.fillStyle=DK;x.beginPath();x.roundRect?x.roundRect(a*s,b*s,7*s,7*s,10):x.rect(a*s,b*s,7*s,7*s);x.fill();x.fillStyle="#fff";x.fillRect((a+1)*s,(b+1)*s,5*s,5*s);x.fillStyle=AC;x.beginPath();x.roundRect?x.roundRect((a+2)*s,(b+2)*s,3*s,3*s,5):x.rect((a+2)*s,(b+2)*s,3*s,3*s);x.fill()});
  x.fillStyle="#fff";x.fillRect(340/2-30,340/2-30,60,60);
}
function finishPay(){
  const t=totals(),c=CUST[S.cust],m=S.method;
  if(m==="cash"&&S.tendered&&+S.tendered<t.total)return toast("Cash received is less than the bill");
  S.cart.forEach((q,k)=>{const l=ln(k),p=l.base;if(l.vi!=null){p.v[l.vi].s=Math.max(0,p.v[l.vi].s-q);p.stock=p.v.reduce((a,v)=>a+v.s,0)}else if(l.loose){p.sk=Math.max(0,Math.round((p.sk-l.g/1000)*1000)/1000);p.stock=p.sk}else p.stock=Math.max(0,p.stock-q)});
  if(m==="khata"){c.due+=t.total;c.ledger.push(["Today","Bill #"+S.billNo,t.total])}
  if(S.cust){c.visits++;c.spent+=t.total;c.points+=Math.floor(t.total/100)}
  const label={cash:"Cash",upi:"UPI",card:"Card",split:"Cash + UPI",khata:"Khata (credit)"}[m];
  const gref=S.gw?(S.gw.utr?"UTR "+S.gw.utr:S.gw.id):"";const gcode=GWCODE[m]||"";S.gw=null;clearInterval(S.gwTimer);
  ORDERS.unshift([S.billNo,new Date().toLocaleTimeString("en-IN",{hour:"numeric",minute:"2-digit"}).toUpperCase(),c.name,t.total,m==="khata"?"Khata":m==="split"?"UPI":label,gref]);
  S.lastCust=S.cust;
  const now=new Date(),chg=+S.tendered-t.total;
  S.lastBill={no:S.billNo,date:now,cust:c,lines:[...S.cart].map(([id,q])=>{const p=ln(id);return p.loose?{n:p.name,u:"Loose · "+fmtW(p.g)+" @ ₹"+p.kg+"/kg",q:"",r:null,a:p.price,g:p.gst}:{n:p.name,u:p.vi!=null?p.unit:p.unit,q,r:p.price,a:q*p.price,g:p.gst}}),t,label,gref,chg:m==="cash"&&chg>0?chg:0,m};
  const showDone=()=>modal("Payment complete",`<div class="done"><div>
    <div class="tick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></div>
    <h3 class="num">${m==="khata"?inr(t.total)+" added to khata":inr(t.total)+" received"}</h3>
    <p class="mut" style="margin:0">Paid by ${label}${m==="cash"&&chg>0?` · give back <b style="color:var(--fg)">${inr(chg)}</b>`:""}${S.cust?` · ${c.name.split(" ")[0]} earned ${Math.floor(t.total/100)} points`:""}</p>
    <div class="share"><button id="printBill">${I.print}Print</button><button id="sendWa" class="wa">${I.wa}WhatsApp</button><button id="smsBill">${I.sms}SMS</button></div>
    <button class="confirm" id="newBill" style="background:linear-gradient(135deg,var(--a1),var(--a2));color:var(--on-a)">Start next bill ${I.arrow}</button>
  </div>
  <div><div class="bseg" role="group" aria-label="Bill design"><button data-bs="classic" aria-pressed="${S.billStyle!=="kirana"}">Classic</button><button data-bs="kirana" aria-pressed="${S.billStyle==="kirana"}">Kirana</button></div>
  <div id="rcWrap">${billHTML(S.lastBill)}</div></div></div>`);
  $("#layer").innerHTML=`<div class="scrim"><div class="modal sm apm" role="status" aria-live="polite"><div class="apbox"><div class="ap" id="ap"><svg viewBox="0 0 100 100" aria-hidden="true"><circle class="trk" cx="50" cy="50" r="44"/><circle class="fill" cx="50" cy="50" r="46"/><circle class="ring" cx="50" cy="50" r="44"/><path class="tick" d="M31 51 L44.5 64 L70 37"/></svg></div>
    <div class="apt" id="apt">${m==="khata"?"Saving to khata…":m==="cash"?"Recording cash…":"Confirming payment…"}</div><div class="aps" id="aps">Bill #${S.billNo}</div></div></div></div>`;
  clearTimeout(S.apT);S.apT=setTimeout(()=>{const a=$("#ap");if(!a)return;a.classList.add("ok");chime();
    $("#apt").innerHTML=`<small>${m==="khata"?"Saved on credit":"Payment received"}</small>${inr(t.total)}`;$("#apt").className="apt big";
    $("#aps").textContent=m==="cash"&&chg>0?"Give back "+inr(chg):"Paid by "+label+(gref.startsWith("UTR")?" · "+gref:"");
    S.apT=setTimeout(()=>{if($("#ap"))showDone()},1700)},1100);
}
function chime(){try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;const c=new A(),t=c.currentTime;[[880,0],[1318.5,.11]].forEach(([f,d])=>{const o=c.createOscillator(),g=c.createGain();o.type="sine";o.frequency.value=f;g.gain.setValueAtTime(0,t+d);g.gain.linearRampToValueAtTime(.18,t+d+.01);g.gain.exponentialRampToValueAtTime(.001,t+d+.5);o.connect(g).connect(c.destination);o.start(t+d);o.stop(t+d+.55)})}catch(e){}}
function words(n){const a=["","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen"],b=["","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"];
  const two=x=>x<20?a[x]:b[Math.floor(x/10)]+(x%10?"-"+a[x%10]:""),three=x=>(x>=100?a[Math.floor(x/100)]+" Hundred"+(x%100?" ":""):"")+(x%100?two(x%100):"");
  if(!n)return"Zero";let o=[];const cr=Math.floor(n/1e7),l=Math.floor(n/1e5)%100,th=Math.floor(n/1e3)%100,r=n%1000;
  if(cr)o.push(three(cr)+" Crore");if(l)o.push(two(l)+" Lakh");if(th)o.push(two(th)+" Thousand");if(r)o.push(three(r));return o.join(" ")}
function billHTML(d){

  const top=k?`${awning}<div class="c kshop">Sharma General Store</div><div class="c kmut">Kirana · Dairy · Fresh vegetables</div><div class="c kmut">12, MG Road, Pune 411001 · GSTIN 27ABCDE1234F1Z5</div><div class="khr"></div>`

    <div class="bi h"><span>Item</span><span>Qty</span><span>Rate</span><span>Amount</span></div>${rows}${hr}
    <div class="rr"><span>Subtotal</span><span>${d.t.sub.toFixed(2)}</span></div>
    ${d.t.disc?`<div class="rr"><span>Discount ${S.disc}%</span><span>-${d.t.disc.toFixed(2)}</span></div>`:""}

    <div class="wd">Rupees ${words(d.t.total)} Only</div>${hr}

    <div class="bc" aria-hidden="true"></div>
    <div class="c" style="margin-top:6px">Thank you! Visit again.<br><span style="opacity:.6">Goods once sold can be exchanged within 7 days</span></div>
  </div>`;
}
